allowBuilds:
  '@google/genai': true
  better-sqlite3: true
  cbor-extract: true
  core-js: true
  esbuild: true
  isolated-vm: true
  koffi: true
  protobufjs: true
  sharp: false
  tesseract.js: false
  unrs-resolver: true

overrides:
  '@vercel/eve-catalog': npm:picocolors@1.1.1
  dompurify: 3.4.17
  proxy-addr: 2.0.8

minimumReleaseAgeExclude:
  - "@ai-sdk/*"
  - "@instantdb/*"
  - "@rolldown/*"
  - "@vercel/*"
  - "@workflow/*"
  - ai
  - experimental-ai-sdk-code-mode
  - eve
  - nitro
  - rolldown
  - workflow
